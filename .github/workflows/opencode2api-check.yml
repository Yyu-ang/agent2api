name: Check OpenCode2API bridge

on:
  pull_request:
    branches: [beta]
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.opencode2api.yml'
      - '.dockerignore'
      - 'scripts/opencode2api-*.mjs'
      - 'integrations/opencode2api/**'
      - 'README.md'
      - 'desktop-tauri/ui/preset-providers.js'
      - 'desktop-tauri/src-tauri/server/src/server/mod.rs'
      - 'desktop-tauri/src-tauri/server/src/server/core/opencode2api_bridge.rs'
      - 'desktop-tauri/src-tauri/server/src/server/core/custom_providers.rs'
      - 'desktop-tauri/src-tauri/server/src/server/core/account_store/**'
      - '.github/workflows/opencode2api-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initializer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check syntax and run isolated tests
        run: |
          node --check scripts/opencode2api-init.mjs
          node --test scripts/opencode2api-init.test.mjs scripts/opencode2api-consistency.test.mjs
      - name: Check Docker Compose overlay
        run: |
          node scripts/opencode2api-init.mjs
          docker compose -f docker-compose.yml -f docker-compose.opencode2api.yml config --quiet
          # The gateway must not wait for the sidecar to become healthy.
          cond=$(docker compose -f docker-compose.yml -f docker-compose.opencode2api.yml config --format json \
            | jq -r '.services.agent2api.depends_on.opencode2api.condition')
          test "$cond" = "service_started" || { echo "agent2api depends_on condition is '$cond'"; exit 1; }

  compose-smoke:
    # Runs the real upstream image with a seed generated by the (non-root)
    # runner user: reproduces the "0600 seed unreadable after su-exec" failure
    # mode. Agent2API itself is not built here (the Rust job covers it).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate seed as the runner user
        run: |
          id -u
          node scripts/opencode2api-init.mjs
          stat -c '%a %U %n' integrations/opencode2api/.secrets integrations/opencode2api/.secrets/config.json .env.opencode2api
      - name: Start sidecar (seed + opencode2api)
        run: docker compose -f docker-compose.yml -f docker-compose.opencode2api.yml up -d opencode2api
      - name: Sidecar runs as its own user with a private, readable config
        run: |
          set -u
          dc="docker compose -f docker-compose.yml -f docker-compose.opencode2api.yml"
          sleep 15
          cid=$($dc ps -q opencode2api)
          test -n "$cid"
          state=$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$cid")
          echo "state: $state"
          test "$state" = "running 0"
          $dc exec -T -u opencode2api opencode2api test -r /var/lib/opencode2api/config.json
          owner=$($dc exec -T opencode2api stat -c '%U %a' /var/lib/opencode2api/config.json | tr -d '\r')
          echo "config owner/mode: $owner"
          case "$owner" in opencode2api\ 600) ;; *) exit 1 ;; esac
          # A second `up` must leave the seeded state alone.
          $dc up -d opencode2api
          $dc logs opencode2api-seed | grep -q 'seed skipped'
      - name: Health (informational; depends on outbound network to opencode.ai)
        if: always()
        run: |
          dc="docker compose -f docker-compose.yml -f docker-compose.opencode2api.yml"
          for i in $(seq 1 12); do
            $dc exec -T opencode2api wget -qO- http://127.0.0.1:8080/healthz && break
            sleep 5
          done || true
          $dc logs opencode2api-seed opencode2api | tail -n 100
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.opencode2api.yml down -v

  rust-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - name: Check headless gateway crate (shared with Tauri desktop)
        run: cargo check --manifest-path desktop-tauri/src-tauri/Cargo.toml --package agent2api-server --locked
      - name: Bridge unit tests
        run: cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml --package agent2api-server --locked --lib opencode2api_bridge
